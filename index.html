<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C1A12">
<meta name="description" content="Personal Digital Tasbeeh - Durood Shareef Counter">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Digital Tasbeeh</title>
<style>
:root{--brown:#2C1A12;--brown2:#3E2723;--brown3:#5D4037;--cream:#FAF3E8;--cream2:#F5EBD6;--gold:#D4AF37;--gold2:#F3D06B;--gold3:#F9E29C}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#4a2b1d 0,#2C1A12 48%,#1B0F0A 100%);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(circle at center,transparent 0 35%,#D4AF37 35.3% 35.5%,transparent 35.8%),repeating-conic-gradient(from 0deg,#D4AF37 0deg 1deg,transparent 1deg 15deg);mask-image:radial-gradient(circle,#000 0 42%,transparent 70%)}
main{position:relative;width:min(100%,440px);padding:26px 24px 22px;border:1px solid #D4AF3780;border-radius:30px;background:linear-gradient(145deg,#3b241aee,#2C1A12f5 65%,#1B0F0Aee);box-shadow:0 25px 70px #0009;text-align:center}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px;color:var(--gold2);font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}.line{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.arabic-card{background:linear-gradient(#FDFBF7,#F5EBD6);border:2px solid var(--gold);border-radius:22px;padding:25px 12px 20px;color:var(--brown);box-shadow:0 8px 20px #0004}
.arabic{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:clamp(39px,10vw,54px);font-weight:700;line-height:1.65;direction:rtl;margin:0}
.translit{font-size:15px;font-weight:650;color:var(--brown3);margin:8px 0 0}
.count-area{margin:28px 0 18px}.label{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#E6D5B8}.count{font-size:clamp(76px,20vw,104px);font-weight:800;line-height:1.1;color:#FDFBF7;font-variant-numeric:tabular-nums;margin:6px 0}
.badge{display:inline-block;border:1px solid #D4AF3766;background:#D4AF3720;color:var(--gold3);padding:5px 14px;border-radius:999px;font-size:13px}
button{font:inherit;cursor:pointer}.tap{width:174px;height:174px;border-radius:50%;border:5px solid var(--gold);background:radial-gradient(circle at 35% 25%,#68483b,#3E2723 60%,#1B0F0A);color:var(--gold2);box-shadow:0 12px 25px #0008,inset 0 0 0 2px #F5EBD633;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:25px auto 28px;transition:transform .12s}
.tap:active{transform:scale(.95)}.plus{font-size:48px;font-weight:800;line-height:1}.tap span:last-child{font-size:15px;color:var(--cream);font-weight:700;letter-spacing:.1em;margin-top:6px}
.footer{border-top:1px solid #D4AF3744;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}.saved{font-size:12px;letter-spacing:.12em;color:#E6D5B8;text-transform:uppercase}.alltime{font-size:13px;color:var(--gold2);margin-top:5px}.reset{border:1px solid #D4AF3770;border-radius:13px;background:#1B0F0A;color:var(--cream);padding:11px 15px;font-size:14px}.reset:hover{background:#4b211c}
.modal{position:fixed;inset:0;z-index:5;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(100%,360px);background:#1B0F0A;border:1px solid var(--gold);border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 60px #0009}.dialog h2{margin:0 0 8px}.dialog p{color:#F5EBD6}.actions{display:flex;gap:10px}.actions button{flex:1;padding:12px;border-radius:12px;border:1px solid #D4AF3766;background:#3E2723;color:var(--cream)}.actions .danger{background:#8b2525}
.install{display:none;margin:16px auto 0;border:1px solid var(--gold);border-radius:12px;background:#D4AF3720;color:var(--gold2);padding:10px 14px}.install.show{display:block}
@media(max-width:360px){main{padding:20px 16px}.tap{width:154px;height:154px}}
</style>
</head>
<body>
<main>
  <div class="header"><span class="line"></span><span>Digital Tasbeeh</span><span class="line"></span></div>
  <section class="arabic-card">
    <h1 class="arabic" lang="ar">صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ</h1>
    <p class="translit">Sallallahu Alayhi Wasallam</p>
  </section>
  <section class="count-area">
    <div class="label">Total Count</div>
    <div id="count" class="count">54</div>
    <div id="milestone" class="badge">MashaAllah! Keep reciting</div>
  </section>
  <button id="add" class="tap" aria-label="Increase Durood count"><span class="plus">+1</span><span>DUROOD</span></button>
  <div class="footer">
    <div><div class="saved">Saved Automatically</div><div class="alltime">All-Time Total: <strong id="alltime">54</strong></div></div>
    <button id="reset" class="reset">↻ &nbsp;Reset</button>
  </div>
  <button id="install" class="install">Install Digital Tasbeeh</button>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="dialog"><h2 id="confirm-title">Reset Counter?</h2><p>Are you sure you want to reset your Durood count back to 0?</p><div class="actions"><button id="cancel">Cancel</button><button id="confirm" class="danger">Yes, Reset</button></div></div>
</div>
<script>
(() => {
 const KEY='durood_shareef_total_count';
 const countEl=document.getElementById('count'), allEl=document.getElementById('alltime'), badge=document.getElementById('milestone'), modal=document.getElementById('modal');
 let total=54;
 try { const saved=localStorage.getItem(KEY); if(saved!==null && Number.isFinite(Number(saved)) && Number(saved)>=0) total=Number(saved); else localStorage.setItem(KEY,'54'); } catch(e){}
 function render(){
   const n=total.toLocaleString(); countEl.textContent=n; allEl.textContent=n;
   let msg='Recite with love & devotion';
   if(total>0 && total%100===0) msg=`MashaAllah! ${n} Durood completed`;
   else if(total>=1000) msg='SubhanAllah! Keep going';
   else if(total>=100) msg='Alhamdulillah! Blessed progress';
   else if(total>=33) msg='MashaAllah! Keep reciting';
   badge.textContent=msg;
 }
 function save(){try{localStorage.setItem(KEY,String(total));}catch(e){}}
 document.getElementById('add').addEventListener('click',()=>{total++;save();render();if(navigator.vibrate)navigator.vibrate(25)});
 document.getElementById('reset').addEventListener('click',()=>{modal.classList.add('show')});
 document.getElementById('cancel').addEventListener('click',()=>modal.classList.remove('show'));
 document.getElementById('confirm').addEventListener('click',()=>{total=0;save();render();modal.classList.remove('show')});
 modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show');if(e.code==='Space' && !modal.classList.contains('show') && !['BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('add').click()}});
 render();
 let deferredPrompt=null; const installBtn=document.getElementById('install');
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.classList.add('show')});
 installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.classList.remove('show')});
 if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error));
})();
</script>
</body></html>
